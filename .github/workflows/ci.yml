name: CI

# master is the integration branch: every push (and PR targeting it) runs the unit-test
# suite so the base stays sane. Production releases are handled separately by release.yml,
# which only triggers on the "release" branch.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 is recent; make sure the platform is present on the runner.
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
