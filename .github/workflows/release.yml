name: Release

# Push to master -> build a SIGNED release APK, publish it + version.json to a GitHub Release.
# The app polls the fixed URL https://github.com/<owner>/<repo>/releases/latest/download/version.json
# (the /latest/ path always resolves to the newest release) to detect updates. Zero infra cost.

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write          # required to create the GitHub Release + upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 is recent; make sure the platform is present on the runner.
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }} \
            --no-daemon --stacktrace

      - name: Prepare artifacts (APK + checksum + version.json)
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK" || { echo "::error::No release APK produced"; exit 1; }
          cp "$APK" goattracker-release.apk
          SHA256=$(sha256sum goattracker-release.apk | cut -d' ' -f1)
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=1.0.${{ github.run_number }}
          APK_URL=https://github.com/${{ github.repository }}/releases/latest/download/goattracker-release.apk
          # Patch notes shown in-app: commit message minus the Co-Authored-By trailer.
          NOTES_CLEAN="$(printf '%s\n' "${NOTES:-$VERSION_NAME}" | sed '/^[Cc]o-[Aa]uthored-[Bb]y:/d')"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg notes "$NOTES_CLEAN" \
            '{versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, notes:$notes}' \
            > version.json
          echo "Generated version.json:"; cat version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            goattracker-release.apk
            version.json
